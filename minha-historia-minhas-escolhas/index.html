:vertical;line-height:1.55}.field input:focus,.field textarea:focus{border-color:#a784cc}.edit-group{border:1px solid #ecdff1;border-radius:19px;padding:12px 16px;margin:16px 0;background:#fffaff}.edit-group legend{font-size:14px;font-weight:900;color:#694e8b;padding:0 6px}.save-toast{background:#e7f6e9;border:1px solid #bedac4;border-radius:13px;padding:12px;color:#3f684d;margin:10px 0;font-size:13px;font-weight:900}.print-only{display:none}.wave{font-size:25px}.copy{font-size:14px;line-height:1.6}.divider{height:1px;background:#eee2f2;margin:18px 0}.tag{font-size:11px;font-weight:900;color:#7151a0;background:#f0eaf8;padding:6px 9px;border-radius:9px}.section-note{background:#f7f5ff;padding:13px 16px;border-radius:15px;color:#5a4e6e;font-size:13px;line-height:1.55}.list-clean{padding-left:20px;line-height:1.7;color:#5b4b69;font-size:14px}.screen-enter{animation:rise .35s ease-out}.float{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}@keyframes glow{50%{opacity:.35;transform:scale(.75)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes breath{0%,100%{transform:scale(.78)}50%{transform:scale(1.13)}}@media(max-width:480px){body{padding:9px 9px 25px}.top{margin:4px 4px 11px}.main{border-radius:23px}.inner{padding:20px 18px}.hero svg{max-height:275px}.hero-sm svg{max-height:200px}.brand{font-size:10px}.brand .mark{width:31px;height:31px;margin-right:3px}.smallbtn{padding:9px;font-size:11px}.story-text{font-size:16px}.reflection-grid{gap:5px}.reflection-opt{font-size:11px}.choice{padding:13px;font-size:14px}.choice .emo{min-width:45px;height:45px}.btn{font-size:15px;padding:15px 17px}}@media print{body{background:white;padding:0}.top,.footer,.actions,.back,.speech-btn,.choice-group,.progress-wrap{display:none!important}.main{border:none;box-shadow:none}.print-only{display:block}.hero{display:none}.card-final{margin-top:70px}}

<script id="story-data" type="application/json">{"title":"O {{objeto}} e a tempestade de emoções","subtitle":"Uma aventura sobre raiva, limites e escolhas","nome":"Lucas","amigo":"Nina","objeto":"foguete","lugar":"sala de brincadeiras","intro":"{{nome}} estava muito feliz construindo uma aventura espacial na {{lugar}}. Seu {{objeto}} de brinquedo estava pronto para decolar!","incident":"De repente, {{amigo}} pegou o {{objeto}} sem pedir. {{nome}} sentiu o rosto esquentar, as mãos ficarem apertadas e uma vontade enorme de gritar.","question":"O que {{nome}} pode fazer agora?","choices":[{"icon":"🌋","label":"Gritar e puxar o {{objeto}} de volta","result":"{{nome}} gritou e puxou o {{objeto}} com força. {{amigo}} ficou assustada e os dois começaram a discutir. A raiva estava tentando contar algo importante, mas os gritos não ajudaram a explicar.","insight":"Sentir raiva é permitido. Podemos aprender a demonstrá-la sem machucar a nós mesmos ou os outros."},{"icon":"🌧️","label":"Ficar em silêncio e guardar tudo","result":"{{nome}} ficou em silêncio e se afastou, mas continuou incomodado. {{amigo}} nem percebeu que ele havia ficado incomodado. Guardar tudo não fez o sentimento desaparecer.","insight":"Às vezes precisamos de um tempo. Depois, podemos procurar uma maneira segura de dizer o que sentimos."},{"icon":"💬","label":"Dizer que ficou incomodado e pedir de volta","result":"{{nome}} respirou um pouco e disse: 'Eu não gostei quando você pegou sem pedir. Pode me devolver?'. {{amigo}} percebeu o que tinha acontecido e o ouviu.","insight":"Falar com respeito ajuda a mostrar limites. Nem sempre o outro concordará, e podemos pedir ajuda se precisarmos."}],"secondQuestion":"Qual recurso pode ajudar {{nome}} a cuidar da emoção e resolver a situação?","strategies":[{"icon":"⭐","label":"Fazer uma pausa e respirar como uma estrela","result":"{{nome}} observou a estrela crescer e diminuir enquanto respirava devagar. A emoção não sumiu de uma vez, mas ele ganhou alguns instantes para escolher como agir.","skill":"PAUSA E RESPIRAÇÃO"},{"icon":"🤝","label":"Pedir ajuda a uma pessoa de confiança","result":"{{nome}} procurou a professora e explicou o que aconteceu. Com ajuda, os dois colegas puderam conversar e combinar uma forma respeitosa de usar os brinquedos.","skill":"PEDIR APOIO"},{"icon":"🗣️","label":"Conversar sobre limites e combinar uma solução","result":"{{nome}} disse como se sentiu. {{amigo}} também contou o que pensou. Os dois combinaram pedir antes de pegar o brinquedo e pensar em uma brincadeira juntos, se ambos quisessem.","skill":"COMUNICAÇÃO E LIMITES"}],"ending":"No fim, {{nome}} descobriu uma coisa importante: ele não precisa esconder a raiva nem deixar que ela mande em suas atitudes. Ele pode perceber o que sente, buscar apoio e escolher como agir.","reflection":"Se alguém pegasse algo seu sem pedir, qual emoção poderia aparecer primeiro?"}</script>
<script>
(function(){
'use strict';
const DEFAULT=JSON.parse(document.querySelector('#story-data').textContent);
const hash=(s)=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
const KEY='clube_story_builder_'+hash(JSON.stringify(DEFAULT));
const safeStorage={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let story=loadStory();let screen='welcome';let previousScreen='welcome';let selectedChoice=-1,selectedStrategy=-1,selectedFeeling='';let showToast='';let reading=false;
const app=document.getElementById('app');
const htmlEscape=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const renderVariables=(s)=>String(s??'').replace(/\{\{(nome|amigo|objeto|lugar)\}\}/g,(_,key)=>String(story[key]??''));
const t=(s)=>htmlEscape(renderVariables(s));
const raw=(s)=>htmlEscape(String(s??''));
function loadStory(){try{const obj=JSON.parse(safeStorage.get(KEY)||'null');return validStory(obj)?obj:structuredClone(DEFAULT)}catch(e){return structuredClone(DEFAULT)}}
function validStory(s){return s&&typeof s.title==='string'&&Array.isArray(s.choices)&&s.choices.length===3&&Array.isArray(s.strategies)&&s.strategies.length===3&&s.choices.every(x=>typeof x.label==='string'&&typeof x.result==='string')&&s.strategies.every(x=>typeof x.label==='string'&&typeof x.result==='string')}
function show(stage){if(reading){window.speechSynthesis?.cancel();reading=false}screen=stage;render();window.scrollTo({top:0,behavior:'smooth'})}

<ellipse cx="376" cy="304" rx="278" ry="24" fill="#b38da4" opacity=".16" filter="url(#shadow)"/>
<!-- Lucas -->
<g transform="translate(180 60)"><path d="M-82 205 Q-91 136 -43 113 Q7 90 43 118 Q91 150 84 205Z" fill="url(#purple)"/><path d="M-30 200 L-34 247 Q-26 265 -5 255 L12 203Z" fill="#35477d"/><path d="M26 200 L30 248 Q50 262 60 245 L60 197Z" fill="#35477d"/><ellipse cx="-27" cy="254" rx="27" ry="10" fill="#e7f9ff"/><ellipse cx="54" cy="253" rx="25" ry="10" fill="#e7f9ff"/><path d="M-70 153 Q-116 176 -95 213" fill="none" stroke="#e2a17e" stroke-width="23" stroke-linecap="round"/><path d="M65 147 Q107 171 107 205" fill="none" stroke="#e2a17e" stroke-width="23" stroke-linecap="round"/><ellipse cx="-2" cy="72" rx="70" ry="77" fill="url(#face)"/><path d="M-68 75 Q-92 16 -46 -10 Q2 -48 54 -8 Q78 14 68 77 L45 27 Q11 40 -28 14 Q-40 50 -68 75Z" fill="#634029"/><path d="M-55 12 Q-35 -17 -19 0 M-16 -12 Q7 -33 28 -9 M32 -5 Q52 -21 60 2" fill="none" stroke="#765034" stroke-width="15" stroke-linecap="round"/><ellipse cx="-25" cy="78" rx="8" ry="11" fill="#3b2a44"/><ellipse cx="24" cy="78" rx="8" ry="11" fill="#3b2a44"/><circle cx="-28" cy="74" r="2.5" fill="white"/><circle cx="21" cy="74" r="2.5" fill="white"/><ellipse cx="-41" cy="100" rx="17" ry="8" fill="#f18e96" opacity=".35"/><ellipse cx="42" cy="99" rx="15" ry="7" fill="#ed8c8b" opacity=".35"/>${sad?'<path d="M-19 128 Q0 113 19 128" fill="none" stroke="#8a4c4e" stroke-width="5" stroke-linecap="round"/>':'<path d="M-17 119 Q0 138 19 119" fill="none" stroke="#914d50" stroke-width="5" stroke-linecap="round"/>'}${sad?'<path d="M-43 54 L-15 58 M16 57 L41 53" stroke="#594033" stroke-width="5" stroke-linecap="round"/>':''}<circle cx="-3" cy="153" r="7" fill="#f6d0e9"/></g>

<g transform="translate(550 86)"><path d="M-70 177 Q-83 118 -39 96 Q5 81 44 104 Q82 130 77 177 L-70 191Z" fill="url(#pink)"/><path d="M-30 177 L-28 217" stroke="#49426e" stroke-width="22" stroke-linecap="round"/><path d="M36 177 L38 217" stroke="#49426e" stroke-width="22" stroke-linecap="round"/><ellipse cx="-30" cy="225" rx="24" ry="10" fill="#fbf7fe"/><ellipse cx="38" cy="225" rx="24" ry="10" fill="#fbf7fe"/><path d="M-63 129 Q-84 158 -84 181" stroke="#d69074" stroke-width="20" stroke-linecap="round"/><path d="M66 130 Q92 158 90 172" stroke="#d69074" stroke-width="20" stroke-linecap="round"/><path d="M-72 50 Q-88 -22 -39 -35 Q1 -54 38 -31 Q81 -22 76 54Z" fill="#392b41"/><ellipse cx="0" cy="42" rx="65" ry="70" fill="url(#face2)"/><path d="M-62 21 Q-55 -29 -23 -19 Q0 -13 17 -26 Q56 -34 66 18 Q13 18 -10 0 Q-37 34 -62 21" fill="#30243a"/><circle cx="-47" cy="-10" r="22" fill="#392b41"/><circle cx="-24" cy="-27" r="24" fill="#392b41"/><circle cx="6" cy="-31" r="22" fill="#392b41"/><circle cx="37" cy="-22" r="22" fill="#392b41"/><ellipse cx="-22" cy="50" rx="7" ry="9" fill="#2f263f"/><ellipse cx="26" cy="50" rx="7" ry="9" fill="#2f263f"/><circle cx="-24" cy="47" r="2.5" fill="#fff"/><circle cx="24" cy="47" r="2.5" fill="#fff"/><path d="M-13 89 Q1 101 16 87" stroke="#8e425a" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="-38" cy="73" rx="13" ry="7" fill="#f78da1" opacity=".35"/><ellipse cx="40" cy="73" rx="12" ry="7" fill="#f78da1" opacity=".35"/><path d="M35 -33 Q72 -55 76 -18 Q56 -15 40 -18Z" fill="#f2d44c"/></g>

${excited?'<g fill="#fbbb64" font-size="24"><text x="75" y="139">✦</text><text x="640" y="220">✦</text></g>':''}</svg></div>`}
const content=(body)=>`<div class="screen-enter">${body}</div>`;
const topProgress=(n)=>`<div class="progress-wrap"><span class="step-label">CAPÍTULO ${Math.min(n,5)} DE 5</span><div class="progress"><i style="width:${Math.min(n,5)*20}%"></i></div></div>`;
const section=(s)=>`<div class="inner">${s}</div>`;
const btn=(id,label,kind='')=>`<button class="btn ${kind}" data-act="${id}">${label}</button>`;
function render(){let b='';
if(screen==='welcome'){b=heroArt('welcome')+section(`<span class="eyebrow">✦ Uma aventura interativa</span><h1 class="h1">Minha História,<br><span class="gradient-word">Minhas Escolhas!</span></h1><p class="lead">${t(story.subtitle)}. Uma aventura em que você ajuda ${t(story.nome)} a descobrir o poder de sentir, pensar e escolher.</p>${btn('start','🚀 Começar a aventura','btn-full')}<div class="actions">${btn('editor','✏️ Personalizar a história','btn-secondary')}${btn('guide','📖 Orientações de uso','btn-outline')}</div><p class="tiny">Indicado como recurso mediado para crianças de aproximadamente 5 a 9 anos. Requer acompanhamento de um adulto.</p>`)}
else if(screen==='intro'){b=heroArt('happy')+section(topProgress(1)+`<div class="speech-row"><span class="eyebrow">🌈 Um dia diferente</span><button class="speech-btn" data-act="speech">🔊 Ouvir</button></div><h2 class="story-title">${t(story.title)}</h2><p class="story-text narratable">${t(story.intro)}</p><p class="story-text narratable">${t(story.incident)}</p><div class="insight">💡 <strong>Pista emocional:</strong> nosso corpo pode dar sinais quando algo nos incomoda.</div><div class="actions">${btn('decision','E agora? Vamos escolher! ✨','btn-full')}</div>`)}
else if(screen==='decision'){b=heroArt('worry')+section(topProgress(2)+`<div class="speech-row"><span class="eyebrow">🤔 Hora de escolher</span><button class="speech-btn" data-act="speech">🔊 Ouvir</button></div><h2 class="story-title">${t(story.question)}</h2><p class="lead narratable">Todas as escolhas têm consequências. Vamos descobrir o que pode acontecer?</p><div class="choice-group">${story.choices.map((c,i)=>`<button class="choice" data-act="choose" data-index="${i}"><span class="emo">${t(c.icon)}</span><span>${t(c.label)}</span><span class="arrow">❯</span></button>`).join('')}</div>`)}
else if(screen==='consequence'){const c=story.choices[selectedChoice];b=heroArt('consequence')+section(topProgress(3)+`<div class="speech-row"><span class="eyebrow">📖 O que aconteceu?</span><button class="speech-btn" data-act="speech">🔊 Ouvir</button></div><h2 class="story-title">Cada atitude conta uma história</h2><p class="story-text narratable">${t(c.result)}</p><div class="insight">💛 <strong>Para conversar:</strong> ${t(c.insight)}</div><div class="actions">${btn('tools','Descobrir outras possibilidades ✨','btn-full')}${btn('decision','↶ Experimentar outra escolha','btn-outline')}</div>`)}
else if(screen==='tools'){b=heroArt('happy')+section(topProgress(4)+`<div class="speech-row"><span class="eyebrow">🧰 Caixa de ferramentas</span><button class="speech-btn" data-act="speech">🔊 Ouvir</button></div><h2 class="story-title">${t(story.secondQuestion)}</h2><p class="lead narratable">Existem diferentes formas de cuidar dos sentimentos. Escolha uma ferramenta para experimentar.</p><div class="choice-group">${story.strategies.map((c,i)=>`<button class="choice" data-act="tool" data-index="${i}"><span class="emo">${t(c.icon)}</span><span>${t(c.label)}</span><span class="arrow">❯</span></button>`).join('')}</div>`)}
else if(screen==='toolresult'){const c=story.strategies[selectedStrategy];b=heroArt('happy')+section(topProgress(4)+`<div class="speech-row"><span class="eyebrow">✨ Descoberta importante</span><button class="speech-btn" data-act="speech">🔊 Ouvir</button></div><h2 class="story-title">Uma nova possibilidade!</h2><p class="story-text narratable">${t(c.result)}</p><div class="insight">🌷 <strong>Habilidade explorada:</strong> ${t(c.skill)}</div>${selectedStrategy===0?'<div class="tool-activity"><span class="pill">EXPERIMENTE COM CALMA</span><div class="breath-star" aria-hidden="true">🌟</div><p class="copy">Observe a estrela crescer enquanto inspira, e diminuir enquanto solta o ar.<br>Faça apenas se for confortável.</p></div>':''}<div class="actions">${btn('reflection','O que eu aprendi? 💖','btn-full')}${btn('tools','↶ Conhecer outra ferramenta','btn-outline')}</div>`)}
else if(screen==='reflection'){b=section(topProgress(5)+`<span class="eyebrow">💗 Olhando para dentro</span><h2 class="story-title">E se fosse com você?</h2><p class="story-text narratable">${t(story.reflection)}</p><div class="reflection-grid">${[{e:'😠',n:'Raiva'},{e:'😢',n:'Tristeza'},{e:'😟',n:'Medo'},{e:'😳',n:'Vergonha'},{e:'😕',n:'Confusão'},{e:'😌',n:'Outra emoção'}].map(x=>`<button class="reflection-opt" data-act="feel" data-feel="${x.n}" aria-pressed="${selectedFeeling===x.n}"><span>${x.e}</span>${x.n}</button>`).join('')}</div><div class="section-note">Nenhuma emoção está errada. Você pode sentir algo diferente do personagem. Se desejar, conte para um adulto em quem confia.</div><div class="actions">${btn('finish','🌟 Finalizar minha aventura','btn-full')}</div>`)}
else if(screen==='finish'){const skill=story.strategies[selectedStrategy]?.skill||'ESCOLHAS CONSCIENTES';b=heroArt('finish')+section(`<span class="eyebrow">🏆 Você chegou ao fim!</span><h2 class="story-title">Parabéns por explorar escolhas!</h2><p class="story-text narratable">${t(story.ending)}</p><div class="card-final"><div class="medal">🌟</div><span class="tag">CARTÃO DA MINHA DESCOBERTA</span><h3>Eu posso sentir e escolher!</h3><p class="copy">Emoção explorada: <strong>${t(selectedFeeling||'a que eu sentir')}</strong><br>Ferramenta escolhida: <strong>${t(skill)}</strong></p><p class="tiny">Meu próximo passo: perceber o que sinto, fazer uma pausa quando preciso e buscar apoio.</p></div><div class="actions">${btn('restart','🔁 Viver a história novamente','btn-full')}${btn('print','🖨️ Imprimir meu cartão','btn-secondary')}${btn('editor','✏️ Criar minha versão','btn-outline')}</div><p class="tiny">Esta atividade não tem pontuação nem resposta única. O objetivo é explorar possibilidades com acolhimento.</p>`)}
else if(screen==='guide'){b=section(`<button class="back" data-act="back">← Voltar à aventura</button><span class="eyebrow">📖 Guia de mediação</span><h2 class="story-title">Como aproveitar a história</h2><p class="lead">Proposta para profissionais e educadores, com mediação de um adulto e adaptação à etapa de desenvolvimento.</p><div class="insight"><strong>Objetivos:</strong> reconhecer emoções e sinais corporais, explorar consequências de comportamentos, praticar comunicação assertiva, estabelecer limites e conhecer estratégias de apoio.</div><ol class="list-clean"><li><strong>Acolha:</strong> explique que não existem sentimentos proibidos.</li><li><strong>Observe:</strong> pergunte quais sinais aparecem no corpo do personagem.</li><li><strong>Explore:</strong> permita testar os três caminhos, sem punir escolhas.</li><li><strong>Converse:</strong> compare as consequências com situações do cotidiano.</li><li><strong>Integre:</strong> ao final, escolha uma habilidade e ensaie com a criança.</li></ol><p class="section-note">Tempo sugerido: 15 a 25 minutos. Não utilize a história para diagnóstico, classificação de crianças ou substituição de cuidado clínico individualizado. Em episódios de conflito, segurança e proteção vêm antes de qualquer exercício de autorregulação.</p><h3>Personalização</h3><p class="copy">Toque em <strong>✏️ Criar</strong> para trocar nomes, cenário, conflito, caminhos e consequências. Depois, exporte um novo arquivo HTML independente, que funciona sem assinatura e sem internet.</p><div class="actions">${btn('editor','✏️ Abrir a fábrica de histórias','btn-full')}</div>`)}
else if(screen==='editor'){b=section(`<button class="back" data-act="back">← Voltar à aventura</button><span class="eyebrow">✏️ Fábrica de histórias</span><h2 class="story-title">Crie a sua versão</h2><p class="lead">Personalize o enredo e os caminhos. Use {{nome}}, {{amigo}}, {{objeto}} e {{lugar}} nos textos para inserir automaticamente as informações dos personagens. Os dados são salvos somente neste navegador. Ao terminar, exporte um HTML independente com a nova história.</p>${showToast?`<div class="save-toast" role="status">✅ ${t(showToast)}</div>`:''}<form id="story-form" novalidate>${editorFields()}<div class="actions"><button type="submit" class="btn btn-full">💾 Salvar e testar</button><button type="button" class="btn btn-secondary" data-act="export-html">⬇️ Baixar história em HTML</button><button type="button" class="btn btn-outline" data-act="export-json">⬇️ Baixar roteiro JSON</button><button type="button" class="btn btn-outline" data-act="import-json">⬆️ Importar roteiro</button><button type="button" class="btn btn-outline" data-act="restore">↶ Restaurar exemplo</button></div><input type="file" accept="application/json,.json" id="json-upload" style="display:none"></form><p class="tiny">Dica: mantenha alternativas com resultados distintos, sem reduzir emoções a respostas certas ou erradas. Revise o roteiro antes de compartilhar com crianças.</p>`)}
app.innerHTML=content(b);document.title=renderVariables(story.title)+' | Clube de Ideias Terapêuticas';
if(screen==='editor'){document.getElementById('story-form').addEventListener('submit',e=>{e.preventDefault();saveEditor(true)});document.getElementById('json-upload').addEventListener('change',handleImport)}
}
function editorFields(){const input=(path,label,multi=false)=>{let val=path.split('.').reduce((v,k)=>v?.[k],story);return `<div class="field"><label for="edit-${path.replaceAll('.','-')}">${label}</label>${multi?`<textarea id="edit-${path.replaceAll('.','-')}" name="${path}" maxlength="1600">${raw(val)}</textarea>`:`<input id="edit-${path.replaceAll('.','-')}" name="${path}" maxlength="180" value="${raw(val)}">`}</div>`};let s='<fieldset class="edit-group"><legend>Identidade e personagens</legend>';for(const [p,l] of [['title','Título da história'],['subtitle','Subtítulo'],['nome','Personagem principal'],['amigo','Outro personagem'],['objeto','Objeto importante'],['lugar','Lugar da história']])s+=input(p,l);s+='</fieldset><fieldset class="edit-group"><legend>Abertura e conflito</legend>';for(const [p,l] of [['intro','Como a história começa'],['incident','O que aconteceu e como a criança se sente'],['question','Pergunta da primeira decisão']])s+=input(p,l,true);s+='</fieldset>';for(let i=0;i<3;i++){s+=`<fieldset class="edit-group"><legend>Escolha ${i+1}</legend>`;for(const [p,l] of [[`choices.${i}.label`,'Texto da escolha'],[`choices.${i}.result`,'Consequência narrada'],[`choices.${i}.insight`,'Reflexão para conversar']])s+=input(p,l,true);s+='</fieldset>'}s+='<fieldset class="edit-group"><legend>Estratégias de cuidado</legend>'+input('secondQuestion','Pergunta da segunda decisão',true)+'</fieldset>';for(let i=0;i<3;i++){s+=`<fieldset class="edit-group"><legend>Ferramenta ${i+1}</legend>`;for(const [p,l] of [[`strategies.${i}.label`,'Nome da ferramenta'],[`strategies.${i}.result`,'Cena/resultado'],[`strategies.${i}.skill`,'Habilidade trabalhada']])s+=input(p,l,true);s+='</fieldset>'}s+='<fieldset class="edit-group"><legend>Conclusão</legend>'+input('ending','Mensagem final da narrativa',true)+input('reflection','Pergunta de reflexão para a criança',true)+'</fieldset>';return s}
function saveEditor(goToStart=false){const form=document.getElementById('story-form');if(!form)return false;const data=new FormData(form);const updated=structuredClone(story);for(const [path,value] of data.entries()){const keys=path.split('.');let dest=updated;for(let i=0;i<keys.length-1;i++)dest=dest[keys[i]];dest[keys.at(-1)]=String(value).trim()}if(!updated.title||!updated.intro||!updated.incident||updated.choices.some(x=>!x.label||!x.result)||updated.strategies.some(x=>!x.label||!x.result)){showToast='Complete título, enredo e alternativas antes de salvar.';render();return false}story=updated;safeStorage.set(KEY,JSON.stringify(story));showToast='Sua versão foi salva neste navegador.';if(goToStart){selectedChoice=-1;selectedStrategy=-1;selectedFeeling='';show('welcome')}return true}
function downloadFile(filename,text,kind){const blob=new Blob([text],{type:kind});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportHtml(){if(!saveEditor(false))return;const root=document.documentElement.cloneNode(true);const data=root.querySelector('#story-data');data.textContent=JSON.stringify(story).replace(/<\//g,'<\\/');const main=root.querySelector('#app');main.innerHTML='';const form=root.querySelector('#story-form');if(form)form.remove();const filename='minha-historia-'+(renderVariables(story.title).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)||'personalizada')+'.html';downloadFile(filename,'<!doctype html>\n'+root.outerHTML,'text/html;charset=utf-8')}
function handleImport(e){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(String(reader.result));if(!validStory(obj))throw Error('Estrutura incompatível');story=obj;safeStorage.set(KEY,JSON.stringify(story));showToast='Roteiro importado. Revise e salve a sua história.';render()}catch(err){showToast='Não foi possível importar. Confira se o arquivo é um roteiro compatível.';render()}};reader.readAsText(f,'utf-8')}
function speech(){if(!('speechSynthesis'in window))return alert('Narração não disponível neste navegador.');if(reading){speechSynthesis.cancel();reading=false;return}const narr=Array.from(app.querySelectorAll('.narratable')).map(n=>n.textContent).join(' ');const opts=screen==='decision'?story.choices.map(x=>x.label).join('. '):screen==='tools'?story.strategies.map(x=>x.label).join('. '):'';let txt=[narr,opts].filter(Boolean).join('. ');if(!txt)txt=app.querySelector('.story-title')?.textContent||story.title;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.rate=.88;u.pitch=1.08;const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('pt-br'));if(v)u.voice=v;u.onend=()=>reading=false;u.onerror=()=>reading=false;speechSynthesis.speak(u);reading=true}
function handleClick(e){const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;switch(act){case 'start':show('intro');break;case 'decision':show('decision');break;case 'choose':selectedChoice=Number(el.dataset.index);show('consequence');break;case 'tools':show('tools');break;case 'tool':selectedStrategy=Number(el.dataset.index);show('toolresult');break;case 'reflection':show('reflection');break;case 'feel':selectedFeeling=el.dataset.feel;render();break;case 'finish':show('finish');break;case 'restart':selectedChoice=-1;selectedStrategy=-1;selectedFeeling='';show('welcome');break;case 'guide':previousScreen=screen;show('guide');break;case 'editor':previousScreen=screen;showToast='';show('editor');break;case 'back':show(previousScreen==='editor'||previousScreen==='guide'?'welcome':previousScreen);break;case 'speech':speech();break;case 'print':window.print();break;case 'export-html':exportHtml();break;case 'export-json':if(!saveEditor(false))break;downloadFile('roteiro-minha-historia.json',JSON.stringify(story,null,2),'application/json');break;case 'import-json':document.getElementById('json-upload').click();break;case 'restore':if(confirm('Restaurar o roteiro de exemplo? As alterações salvas nesta página serão substituídas.')){story=structuredClone(DEFAULT);safeStorage.set(KEY,JSON.stringify(story));showToast='Roteiro original restaurado.';render()}break;}}
document.addEventListener('click',handleClick);render();
})();
</script>
</body>
</html>
